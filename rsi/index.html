<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSI Radar · Mianzhi Pan</title>
<meta name="description" content="Recursive self-improvement 论文库与每日研究进展点评。">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#24292e;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}a{color:#0366d6;text-decoration:none}a:hover{text-decoration:underline}button,select{font:inherit}button,a,select{touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #0366d6;outline-offset:4px}.wrap{max-width:1050px;margin:auto;padding:0 24px}header{border-bottom:1px solid #e5e7eb}.identity{display:flex;align-items:center;gap:10px;padding:20px 0;color:#586069}.identity img{width:32px;height:32px;object-fit:cover;border-radius:4px}.identity a{color:inherit}h1{font-size:30px;line-height:1.3;margin:14px 0 6px}h2{font-size:21px;line-height:1.4;margin:0 0 12px}h3{font-size:17px;line-height:1.5;margin:0 0 8px}.meta{font-size:13px;color:#6b7280}.heading{padding:8px 0 22px}.summary{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:#586069}nav{display:flex;gap:24px}nav a{padding:12px 0;color:#586069;border-bottom:2px solid transparent}nav a.active{color:#0366d6;border-color:#0366d6}main{padding-top:24px;padding-bottom:48px}.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}select{max-width:100%;padding:6px 10px;border:1px solid #d1d5da;border-radius:4px;background:#fff;color:#24292e}.critique{border-left:3px solid #2c8a70;padding:0 0 0 18px;margin:0 0 28px;font-size:16px;line-height:1.9}.paper{border-top:1px solid #e5e7eb;padding:22px 0}.paper h3 a{overflow-wrap:anywhere}.paper .meta{overflow-wrap:anywhere}.tags{margin:6px 0 10px;font-size:12px;color:#2c8a70}.tldr p{margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.tldr strong{color:#24292e}.badge{font-size:12px;color:#6b7280;margin-left:8px;white-space:nowrap}details{margin-top:12px}summary{cursor:pointer;color:#0366d6;font-size:13px}.abstract{color:#586069;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}footer{border-top:1px solid #e5e7eb;padding:20px 0 28px;font-size:12px;color:#6b7280}.empty{padding:40px 0;color:#6b7280}.references{display:flex;gap:8px 16px;flex-wrap:wrap;margin:16px 0;font-size:13px}.progress{border-top:1px solid #e5e7eb;padding:22px 0}.progress p{margin:8px 0}.limit{color:#6b7280;font-size:13px}.citation{font-size:12px}.notice{font-size:12px;color:#6b7280;margin:16px 0 26px}@media(max-width:600px){.wrap{padding:0 18px}h1{font-size:26px}nav{gap:22px}.critique{font-size:15px}.summary{gap:8px 18px}.toolbar{align-items:flex-start}.badge{display:inline-block;margin-left:0;margin-right:8px}.paper{padding:18px 0}}
</style>
</head>
<body>
<header><div class="wrap"><div class="identity"><img src="../images/pmz.jpg" alt="Mianzhi Pan"><a href="../">Mianzhi Pan</a><span>/</span><span>Research Notes</span></div><div class="heading"><h1>RSI Radar</h1><div class="meta">Recursive Self-Improvement · 论文与研究进展</div><div class="summary" id="summary"></div></div><nav aria-label="主要视图"><a href="#daily" data-view="daily">每日锐评</a><a href="#papers" data-view="papers">论文库</a><a href="#progress" data-view="progress">研究进展</a></nav></div></header>
<main class="wrap" id="content" aria-live="polite"><p class="empty">正在读取论文库…</p></main>
<footer><div class="wrap">作者实验不等于独立复现；创新性判断受来源覆盖和历史基线限制。<br><a href="../">个人主页</a> · <a href="https://github.com/panmianzhi/panmianzhi.github.io">GitHub</a></div></footer>
<script src="data.js"></script>
<script>
const data=window.RSI_DATA,content=document.getElementById('content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label)=>/^https?:\/\//.test(url)?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':esc(label);
const byId=new Map((data?.papers||[]).map(p=>[p.paper_id,p]));
function prose(s){return String(s||'').replace(/\s*(背景与问题|方法|结果与结论|Insights)：/g,'\n\n$1：').trim().split(/\n\s*\n/).filter(Boolean).map(p=>{const m=p.match(/^(背景与问题|方法|结果与结论|Insights)：([\s\S]*)/);return '<p>'+(m?'<strong>'+esc(m[1])+'：</strong>'+esc(m[2]):esc(p))+'</p>'}).join('')}
function article(p,tldr){return '<article class="paper" id="paper-'+encodeURIComponent(p.paper_id)+'"><h3>'+link(p.url,p.title)+'</h3><div class="meta">'+esc(p.authors||'作者信息待补充')+'</div>'+(p.affiliations?'<div class="meta">'+esc(p.affiliations)+'</div>':'')+'<div class="meta">发表 '+esc(p.published_at||'日期未提供')+' · 收录 '+esc(p.added_on)+'</div><div class="tags">'+esc(p.topics)+'</div><div class="tldr">'+prose(tldr||p.tldr||'TL;DR 待补充。')+'</div>'+(p.abstract?'<details><summary>Abstract</summary><p class="abstract">'+esc(p.abstract)+'</p></details>':'')+(p.novelty_summary?'<details><summary>创新性分析</summary><p class="abstract">'+esc(p.novelty_summary)+'</p></details>':'')+'</article>'}
function route(){if(!data){content.innerHTML='<p class="empty">论文库暂不可用。</p>';return}const params=new URLSearchParams(location.hash.slice(1).replace(/^([^?]+)\??/,'view=$1&'));const view=['daily','papers','progress'].includes(params.get('view'))?params.get('view'):'daily';document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('active',a.dataset.view===view);if(a.dataset.view===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.getElementById('summary').textContent=data.papers.length+' 篇论文 · '+data.reports.length+' 期日报 · 更新于 '+data.updated_at;
if(view==='daily'){const report=data.reports.find(r=>r.date===params.get('date'))||data.reports[0];if(!report){content.innerHTML='<p class="empty">暂无日报。</p>';return}content.innerHTML='<div class="toolbar"><h2>'+esc(report.date)+' · RSI 进展锐评</h2><select id="date" aria-label="日报日期">'+data.reports.map(r=>'<option '+(r.date===report.date?'selected ':'')+'value="'+esc(r.date)+'">'+esc(r.date)+'</option>').join('')+'</select></div><div class="critique">'+esc(report.critique).replace(/\[(\d+)\]/g,'<a class="citation" href="#ref-$1">[$1]</a>')+'</div><div class="references">'+report.source_ids.map((id,i)=>{const p=byId.get(id);return p?'<span id="ref-'+(i+1)+'">['+(i+1)+'] '+link(p.url,p.title)+'</span>':''}).join('')+'</div><p class="notice">本期分析 '+report.papers.length+' 篇'+(report.backlog?' · 尚有 '+report.backlog+' 篇待分析':'')+'。日报日期是巡检日期，论文实际发表日期见各条目。</p><h2>本期论文 · TL;DR</h2>'+report.papers.map(a=>{const p=byId.get(a.paper_id);return p?article(p,a.tldr):''}).join('');document.getElementById('date').onchange=e=>{location.hash='daily?date='+e.target.value}}
else if(view==='papers'){const days=[...new Set(data.papers.map(p=>p.added_on))].sort().reverse(),day=params.get('date')||'';const papers=data.papers.filter(p=>!day||p.added_on===day);content.innerHTML='<div class="toolbar"><h2>论文库 <span class="badge">'+papers.length+' 篇</span></h2><select id="added" aria-label="收录日期"><option value="">全部收录日期</option>'+days.map(d=>'<option '+(d===day?'selected ':'')+'value="'+esc(d)+'">'+esc(d)+' 收录</option>').join('')+'</select></div>'+papers.map(p=>article(p)).join('');document.getElementById('added').onchange=e=>{location.hash='papers'+(e.target.value?'?date='+e.target.value:'')}}
else{content.innerHTML='<h2>研究进展</h2>'+data.progress.map(p=>'<article class="progress"><div class="tags">'+esc(p.topic)+' · '+esc(({new_direction:'新方向',advance:'重要推进',incremental:'增量工作',watch:'待观察'})[p.kind]||p.kind)+'</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.description)+'</p><p class="limit">'+esc(p.limitations)+'</p><div class="references">'+p.paper_ids.map(id=>{const paper=byId.get(id);return paper?link(paper.url,paper.title):''}).join('')+'</div></article>').join('')}}
content.addEventListener('click',e=>{const a=e.target.closest('a.citation');if(a){e.preventDefault();document.getElementById(a.getAttribute('href').slice(1))?.scrollIntoView({block:'center',behavior:'smooth'})}});
window.addEventListener('hashchange',route);route();
</script>
</body></html>
